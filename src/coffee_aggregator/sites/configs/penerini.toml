# Penerini Coffee — the shop lives on the eshop. subdomain, not on the
# brand site. Blends and single origins share one parameter table.
platform = "shoptet"
site_id = "penerini"
name = "Penerini Coffee"
country = "CZ"
base_url = "https://eshop.penerini.cz/"
category_urls = ["https://eshop.penerini.cz/cerstveprazenakava/"]
currency = "CZK"
max_pages = 20
pagination = "path"

# The category also lists things that are not whole beans.
# "white labeling" is a roasting service the shop prices at 99 899 999 001
# CZK so that nobody buys it by accident; the tote bag is merchandise.
ignore = [
  "platena taska",
  "white labeling",
]

# Parameter names this shop invents that the built-in CZ/SK/EN map
