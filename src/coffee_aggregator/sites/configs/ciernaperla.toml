# The roast is published on 28 of 34 products, but only ever as a sentence of
# its own in the description — "<p>Pražíme CITY.</p>", "Pražíme Full City" —
# never as an attribute, so read_lines sees prose and nothing feeds F_ROAST.
# Do not add "pražíme" to a label_map: without a colon it is not a label, and
# as a bare label it would swallow the line below it instead.
#
# A flat taxonomy with no parents at all and a duplicated coffee term
# (49 pure-arabica and 219 pure-arabica-2 hold the same nine products), so
# every bean term is pinned and the adapter de-duplicates by product id.
platform = "woocommerce"
site_id = "ciernaperla"
name = "Čierna perla"
country = "SK"
base_url = "https://www.ciernaperla.sk/"
currency = "EUR"
mode = "api"
max_pages = 10

# Pinned ids, not slugs: ids survive a re-theme, slugs do not.
api_category_ids = [34, 49, 219, 132, 342, 309]

# The HTML fallback, used only if /wp-json/ ever stops answering.
category_urls = [
  "https://www.ciernaperla.sk/kategoria-produktu/alexs-specialty-coffee/",
]

# The catalogue also sells things that are not coffee beans.
ignore = [
  "caje",
  "cokolad",
  # "COFFEE SET 1+1" and "1+1+1" state "1x250g + 1x500g", a sum no parser
  # reads: the name yields 250 g and the price buys 750 g or 1750 g. The
  # "DARČEKOVÉ BALENIE Coffee set" is a hamper — its 60 € buys 2x250g of
  # coffee plus the Bialetti moka pot this shop sells alone for 26 €, so the
  # 250 g in its name would publish 240 €/kg against a true 68 €/kg at most.
  # The Mini (3x100g) and TRENDY (2x 250g) packs state the coffee their price
  # buys, so they parse to 300 g and 500 g and left this list (#58); TRENDY's
  # added chocolate is the same extra the "Venchi" 250 g pack already carries.
  "coffee set",
  # A moka pot. The brand is not a global marker: Bialetti sells coffee too.
  "bialetti",
]
