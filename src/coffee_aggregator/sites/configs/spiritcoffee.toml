# Spirit Coffee — simple products; every fact is a "Label: value" line in
# the description, and the weight attribute is spelled with its colon.
#
# Switched off on 2026-10-02 over a certificate that named only
# *.r2.websupport.sk; that much is fixed, and the reason below replaces it.
# Re-checked on 2026-10-08: the certificate is now Let's Encrypt for
# spiritcoffee.sk, robots.txt reads, and the shop sells coffee as before —
# but neither way in gives us products. The Store API returns 200 with
# Content-Type: application/json and a PHP warning from the amaya-child
# theme printed before the body, so it does not parse, and the HTML
# fallback then discovers the category menu instead of the ten products
# on /c/kava/ and files /c/kava/, /c/kavove-sety/ and /c/prislusenstvo/
# as coffees, priced "from" and weightless. Deleting the line below alone
# puts those category pages in the catalogue; the shop needs the theme
# warning gone upstream, or a listing selector that ignores /c/ links.
disabled = "Store API prints a PHP warning before its JSON, 2026-10-08"
platform = "woocommerce"
site_id = "spiritcoffee"
name = "Spirit Coffee"
country = "SK"
base_url = "https://spiritcoffee.sk/"
currency = "EUR"
mode = "api"
max_pages = 10

# Pinned ids, not slugs: ids survive a re-theme, slugs do not.
# 53 kava (10).
api_category_ids = [53]

# The HTML fallback, used only if /wp-json/ ever stops answering.
category_urls = [
  "https://spiritcoffee.sk/c/kava/",
]

# The catalogue also sells things that are not coffee beans.
ignore = [
  "flow",
]

[label_map]
"Región pestovania" = "region"
