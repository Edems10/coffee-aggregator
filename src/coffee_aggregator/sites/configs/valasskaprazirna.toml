# Valašská pražírna — blends carry invented names ("MANGOVER", "TUTTI FRUTTI")
# with no origin in the title; sets and cascara share the category.
platform = "shoptet"
site_id = "valasskaprazirna"
name = "Valašská pražírna"
country = "CZ"
base_url = "https://www.valasska-prazirna.cz/"
category_urls = ["https://www.valasska-prazirna.cz/kava/"]
currency = "CZK"
max_pages = 20
pagination = "path"

# The last three are this shop's own wording; the rest come from the retired
# `valasska` config, which listed the gear and gift boxes the category also
# carries. Only these three caught the "All-star set káv" and "ČERNÝ SET KÁV
# 3x 75g" that reached the 2026-09-30 snapshot under `valasska` as if they
# were beans.
ignore = [
  "darkova",
  "darkovy",
  "degustacni sada",
  "instantni",
  "mlynek",
  "set kav",
  "all-star set",
]
